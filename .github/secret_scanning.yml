# Secret scanning: paths excluded from alerts.
# samples/1m/input/env_file.env is a generated 1 MB .env-shaped benchmark corpus. Its ~9,000
# *_KEY / *_PASSWORD / *_SECRET values are random strings that correspond to no service, account
# or host (see samples/CORPUS-NOTE.md). Kept byte-for-byte because published numbers depend on it.
paths-ignore:
  - "samples/1m/input/env_file.env"
