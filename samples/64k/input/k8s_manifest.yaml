apiVersion: v1
kind: ConfigMap
metadata:
  name: cache-config
  namespace: development
data:
  LOG_LEVEL: info
  API_URL: http://backend-service:8080
  CACHE_TTL: "2761"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-deployment
  minReplicas: 2
  maxReplicas: 12
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 72
---
