version: '3.8'

services:
  web-0:
    image: python:3.12-slim
    container_name: web-0-container
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://user:pass@db:5432/app
      - REDIS_URL=redis://cache:6379
      - LOG_LEVEL=info
    ports:
      - "3000:3076"
    volumes:
      - ./data/web:/app/data
      - ./logs:/app/logs
    depends_on:
      - db-0
      - cache-0
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3014/health"]
      interval: 30s
      timeout: 10s
      retries: 3

